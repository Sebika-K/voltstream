server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The app is a single-page app: pages like /batteries/BAT-000001 don't exist
    # as real files. If a file isn't found, serve index.html and let React Router
    # work out which page to show -- otherwise refreshing such a page gives a 404.
    location / {
        try_files $uri /index.html;
    }
}
